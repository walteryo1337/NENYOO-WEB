<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nenyoo — Brand family</title><style>*{box-sizing:border-box}body{margin:0;background:#09090d;color:#f6f0ff;font-family:system-ui,sans-serif}main{max-width:1250px;margin:auto;padding:60px 24px}header{margin-bottom:40px}small{color:#b89ae7;letter-spacing:.2em}h1{font-size:clamp(32px,5vw,60px);margin:12px 0}p{color:#aaa0b8}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}article{border:1px solid #ffffff15;border-radius:14px;overflow:hidden;background:#101016}img{width:100%;display:block}footer{padding:18px;display:flex;justify-content:space-between;align-items:center}a{color:#c9acf2;text-decoration:none;font-size:13px}a:focus-visible{outline:2px solid #c9acf2;outline-offset:4px}h2{font-size:15px;margin:0}@media(max-width:800px){section{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){section{grid-template-columns:1fr}}</style></head><body><main><header><small>NENYOO / IDENTITY</small><h1>One family. Nine identities.</h1><p>Game-inspired artwork with the original Nenyoo identity.</p><a href="nenyoo-logo-pack.zip?v=game-7" download>Download the complete logo pack ↗</a></header><section id="logos"></section><script>const brands=[['gtav','GTA V'],['fivem','FiveM'],['redm','RedM'],['r6','Rainbow Six Siege'],['rdr2','RDR2'],['free','Free'],['vip','VIP'],['mvp','MVP'],['mvp-plus','MVP+']];document.querySelector('#logos').innerHTML=brands.map(([id,name])=>`<article><a href="nenyoo-${id}.png?v=game-7" target="_blank"><img src="nenyoo-${id}.png?v=game-7" alt="Nenyoo ${name} logo"></a><footer><h2>${name}</h2><a href="nenyoo-${id}.png?v=game-7" download>Download PNG ↓</a></footer></article>`).join('');</script></main></body></html>
